spring:
  application:
    name: short-link-test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:shortlink_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: 6379
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfiguration

short-link:
  domain:
    default: 127.0.0.1:8001
  stats:
    locale:
      amap-key: test-api-key
  goto-domain:
    white-list:
      enable: false
      names: ''
      details: []
  group:
    max-num: 20
  flow-limit:
    enable: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  mapper-locations: classpath:mapper/*.xml

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: test-producer-group
    topic: test-topic
    send-message-timeout: 2000
    retry-times-when-send-failed: 0
    retry-times-when-send-async-failed: 0
  consumer:
    group: test-consumer-group

caffeine:
  short-link-redirect:
    maximum-size: 100
    expire-after-write: 60s

clickhouse:
  datasource:
    url: jdbc:clickhouse://127.0.0.1:8123/test
    username: admin
    password: admin

stats:
  storage:
    primary: mysql
