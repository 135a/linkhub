server {
    listen 80;
    server_name shortlink.nym.asia localhost;

    # ───────────────────────────────────────────────────────
    # Docker 内置 DNS 解析器 (127.0.0.11)
    # 使用变量定义 upstream 可以防止 Nginx 在启动阶段因找不到 host 而崩溃
    # ───────────────────────────────────────────────────────
    resolver 127.0.0.11 valid=30s;
    set $backend_upstream "http://shortlink-project:8001";

    # -------------------------------------------------------
    # Real IP 还原：信任上游所有私有/Docker 网段作为代理
    # 让 $remote_addr 还原为真实客户端公网 IP
    # 不影响博客等其他服务，仅作用于本容器
    # -------------------------------------------------------
    set_real_ip_from 10.0.0.0/8;        # 私有 A 类
    set_real_ip_from 172.16.0.0/12;     # Docker 默认网段（172.16~172.31）
    set_real_ip_from 192.168.0.0/16;    # 私有 C 类
    set_real_ip_from 127.0.0.1;         # 本机回环
    real_ip_header    X-Forwarded-For;  # 从 XFF 头中读取真实 IP
    real_ip_recursive on;               # 递归剥离所有可信代理 IP，找到最原始的客户端 IP

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    root /usr/share/nginx/html;
    index index.html;

    # Short link redirect: proxy Base62 codes to backend BEFORE Vue Router fallback
    location ~ "^/(?!login$|home$)([a-zA-Z0-9]{4,8})$" {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;          # 此时 $remote_addr 已是真实客户端 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Handle Vue Router history mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # API proxy to monolith project service
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;          # 真实客户端 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout settings
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Disable cache for HTML files
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

